<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Bull</title>

    <!-- Fontes: Fraunces (serifa com personalidade, usada no título/marca) e Manrope (texto do dia a dia) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="variaveis.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0A0A0A">
    <link rel="apple-touch-icon" href="icone-192.png">
    <link rel="icon" href="favicon-32.png" sizes="32x32">
    <link rel="icon" href="favicon-16.png" sizes="16x16">
</head>
<body id="pagina-login">

    <div class="tela-carregamento" id="tela-carregamento">
        <div class="conteudo-carregamento">
            <span class="selo-marca-carregamento">Bull</span>

            <div class="barra-progresso-carregamento">
                <div class="barra-progresso-preenchimento" id="barra-progresso-preenchimento"></div>
            </div>

            <p class="texto-status-carregamento" id="texto-status-carregamento">Preparando tudo pra você</p>
        </div>
    </div>

    <div class="tela-login">

        <!-- Esse "envelope" só importa no celular — é ele que desliza pra
             fazer a transição entre a etapa "Começar" e o formulário. No
             desktop, vira "invisível" pro layout (display: contents) e os
             dois painéis continuam se comportando como sempre. -->
        <div class="paginas-login-wrapper">

        <!-- ========================================================== -->
        <!-- PAINEL DA MARCA (lado esquerdo no desktop, topo no celular) -->
        <!-- ========================================================== -->
        <div class="painel-marca">
            <div class="conteudo-marca">
                <span class="selo-marca">Bull</span>
                <h1 class="titulo-marca">Cada centavo,<br>sob seu controle.</h1>
                <p class="texto-marca">Registre ganhos, gastos do dia a dia e descubra pra onde o dinheiro está indo — sem planilha complicada.</p>

                <!-- Elemento assinatura: linha de crescimento que se desenha sozinha -->
                <svg class="grafico-assinatura" viewBox="0 0 320 130" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <defs>
                        <linearGradient id="gradienteAreaMarca" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
                            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
                        </linearGradient>
                    </defs>
                    <path id="area-crescimento"
                          d="M10 95 C 60 100, 90 70, 120 75 S 180 40, 210 45 S 270 15, 310 20 L 310 130 L 10 130 Z"
                          fill="url(#gradienteAreaMarca)"/>
                    <path id="linha-crescimento" d="M10 95 C 60 100, 90 70, 120 75 S 180 40, 210 45 S 270 15, 310 20"
                          stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none"/>
                    <circle class="ponto-grafico ponto-1" cx="10" cy="95" r="4" fill="#FFFFFF"/>
                    <circle class="ponto-grafico ponto-2" cx="120" cy="75" r="4" fill="#FFFFFF"/>
                    <circle class="ponto-grafico ponto-3" cx="210" cy="45" r="4" fill="#FFFFFF"/>
                    <circle class="ponto-grafico ponto-4" cx="310" cy="20" r="5" fill="#FFFFFF"/>
                </svg>

                <!-- Só aparece no celular — no desktop os dois painéis já
                     ficam visíveis ao mesmo tempo, não precisa dessa etapa -->
                <button type="button" class="botao-enviar botao-comecar" id="botao-comecar">Começar</button>
            </div>
        </div>

        <!-- ========================================================== -->
        <!-- PAINEL DO FORMULÁRIO (lado direito no desktop, embaixo no celular) -->
        <!-- ========================================================== -->
        <div class="painel-formulario">
            <div class="cartao-formulario">

                <!-- Só aparece no celular, junto com a etapa "Começar" -->
                <button type="button" class="botao-voltar-login" id="botao-voltar-login" aria-label="Voltar">← Voltar</button>

                <!-- Abas para alternar entre Entrar e Criar conta -->
                <div class="abas-acesso" role="tablist">
                    <button class="aba-botao ativa" id="aba-entrar" role="tab" aria-selected="true">Entrar</button>
                    <button class="aba-botao" id="aba-cadastro" role="tab" aria-selected="false">Criar conta</button>
                </div>

                <!-- Mensagem de erro/aviso, escondida até acontecer algo -->
                <div class="mensagem-aviso" id="mensagem-aviso" role="alert"></div>

                <form id="formulario-acesso" novalidate>
                    <div class="campo">
                        <label for="campo-email">E-mail</label>
                        <input type="email" id="campo-email" name="email" placeholder="voce@exemplo.com" autocomplete="email" required>
                    </div>

                    <div class="campo">
                        <label for="campo-senha">Senha</label>
                        <div class="campo-senha-wrapper">
                            <input type="password" id="campo-senha" name="senha" placeholder="Mínimo 6 caracteres" autocomplete="current-password" minlength="6" required>
                            <button type="button" class="botao-olho" id="botao-olho" aria-label="Mostrar senha">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                                    <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                        <button type="button" class="link-esqueci-senha" id="link-esqueci-senha">Esqueci minha senha</button>
                    </div>

                    <!-- Campo extra, só aparece na aba "Criar conta" -->
                    <div class="campo campo-confirmar" id="campo-confirmar" hidden>
                        <label for="campo-confirmar-senha">Confirmar senha</label>
                        <div class="campo-senha-wrapper">
                            <input type="password" id="campo-confirmar-senha" name="confirmarSenha" placeholder="Repita a senha" autocomplete="new-password">
                            <button type="button" class="botao-olho" id="botao-olho-confirmar" aria-label="Mostrar senha">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                                    <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="botao-enviar" id="botao-enviar">
                        <span class="texto-botao">Entrar</span>
                        <span class="spinner-botao" hidden></span>
                    </button>
                </form>

                <div class="divisor-ou"><span>ou</span></div>

                <button type="button" class="botao-google" id="botao-google">
                    <svg width="18" height="18" viewBox="0 0 48 48">
                        <path fill="#EA4335" d="M24 9.5c3.4 0 6.4 1.2 8.8 3.5l6.5-6.5C35.3 2.5 30 0 24 0 14.6 0 6.5 5.4 2.5 13.2l7.6 5.9C11.9 13 17.4 9.5 24 9.5z"/>
                        <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.9 7.2l7.5 5.8C43.9 37.9 46.5 31.8 46.5 24.5z"/>
                        <path fill="#FBBC05" d="M10.1 19.1c-.6 1.8-1 3.7-1 5.9s.4 4.1 1 5.9l-7.6 5.9C.9 33.4 0 29 0 25s.9-8.4 2.5-11.8l7.6 5.9z"/>
                        <path fill="#34A853" d="M24 49c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.6 0-12.1-4.5-14.1-10.5l-7.6 5.9C6.5 43.6 14.6 49 24 49z"/>
                    </svg>
                    Entrar com o Google
                </button>

                <p class="rodape-formulario">Seus dados são só seus — cada pessoa vê apenas os próprios lançamentos.</p>
            </div>
        </div>

        </div>
        <!-- fim do envelope -->

    </div>

    <!-- Aparece só quando a pessoa loga numa conta marcada pra exclusão, ainda
         dentro do prazo de 7 dias — dá a chance de reativar em vez de perder
         tudo. Ver a checagem em app.js, logo após o login. -->
    <div class="fundo-modal" id="fundo-modal-reativar">
        <div class="modal-lancamento">
            <div class="cabecalho-modal">
                <h3>Sua conta está marcada para exclusão</h3>
            </div>
            <p id="texto-prazo-exclusao" style="color: var(--text-muted); font-size: 14px; line-height: 1.6; margin-bottom: 22px;"></p>
            <button type="button" class="botao-enviar" id="botao-reativar-conta">
                <span class="texto-botao">Reativar minha conta</span>
            </button>
            <button type="button" class="link-botao-simples" id="botao-sair-sem-reativar" style="display:block; margin: 16px auto 0;">Sair sem reativar</button>
        </div>
    </div>

    <!-- app.js já importa o Firebase e a configuração internamente, por isso só ele precisa ser carregado aqui -->
    <script type="module" src="app.js"></script>
    <script>
        // Registra o service worker (só funciona em produção/HTTPS, ex: GitHub Pages)
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
        }
    </script>
</body>
</html>
