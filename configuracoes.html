<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Configurações — Bull</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="variaveis.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="extrato.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0A0A0A">
    <link rel="apple-touch-icon" href="icone-192.png">
    <link rel="icon" href="favicon-32.png" sizes="32x32">
    <link rel="icon" href="favicon-16.png" sizes="16x16">
</head>
<body>

    <div class="app-shell">
        <header class="topo-app">
            <a href="dashboard.html" class="link-voltar" aria-label="Voltar">←</a>
            <div class="marca-topo">Configurações</div>
            <span style="width:24px"></span>
        </header>

        <main class="conteudo-principal">
            <a href="perfil.html" class="botao-encerrar-sessao">Editar Perfil</a>

            <a href="conta.html" class="botao-encerrar-sessao" style="margin-top: 10px;">Trocar E-mail/Senha</a>

            <button type="button" class="botao-encerrar-sessao" id="botao-abrir-trocar-principal" style="margin-top: 10px;">
                Trocar Banco Principal
            </button>

            <a href="historico-faturas.html" class="botao-encerrar-sessao" style="margin-top: 10px;">Histórico de Faturas Pagas</a>

            <button type="button" class="botao-encerrar-sessao" id="botao-sair" style="margin-top: 24px; border-color: var(--error); color: var(--error);">
                Encerrar Sessão
            </button>
        </main>
    </div>

    <div class="fundo-modal" id="fundo-modal-trocar-principal">
        <div class="modal-lancamento">
            <div class="cabecalho-modal">
                <h3>Trocar banco principal</h3>
                <button class="botao-fechar-modal" id="botao-fechar-trocar-principal" aria-label="Fechar">✕</button>
            </div>
            <p class="texto-explicativo-guardado">O banco principal é o que aparece no "Saldo do Mês" da tela inicial. Trocar não move nenhum dinheiro — só troca qual saldo é exibido ali.</p>
            <div class="campo">
                <label for="campo-novo-banco-principal">Novo banco principal</label>
                <select id="campo-novo-banco-principal"></select>
            </div>
            <div class="mensagem-aviso" id="mensagem-aviso-trocar-principal" role="alert"></div>
            <button type="button" class="botao-enviar" id="botao-continuar-trocar-principal">
                <span class="texto-botao">Continuar</span>
            </button>
        </div>
    </div>

    <div class="fundo-modal" id="fundo-modal-confirmar">
        <div class="modal-lancamento">
            <div class="cabecalho-modal">
                <h3 id="titulo-modal-confirmar">Confirmar</h3>
                <button class="botao-fechar-modal" id="botao-fechar-confirmar" aria-label="Fechar">✕</button>
            </div>
            <p class="texto-explicativo-guardado" id="texto-modal-confirmar"></p>
            <button type="button" class="botao-enviar" id="botao-confirmar-acao">Confirmar</button>
            <button type="button" class="link-botao-simples" id="botao-cancelar-acao" style="display:block; margin: 14px auto 0;">Cancelar</button>
        </div>
    </div>

    <script type="module" src="configuracoes.js"></script>
</body>
</html>
