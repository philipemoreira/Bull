<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <script>
        // Aplica o tema salvo ANTES da tela desenhar, pra não piscar
        // escuro e depois trocar pra claro na frente da pessoa.
        (function () {
            try {
                if (localStorage.getItem("bull_tema") === "claro") {
                    document.documentElement.setAttribute("data-tema", "claro");
                }
            } catch (erro) { /* localStorage bloqueado — segue no tema padrão */ }
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Extrato Completo — Bull</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="variaveis.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="extrato.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0A0A0A">
    <link rel="icon" href="favicon-32.png" sizes="32x32">
    <link rel="icon" href="favicon-16.png" sizes="16x16">
</head>
<body>

    <div class="app-shell">
        <header class="topo-app">
            <a href="dashboard.html" class="link-voltar" aria-label="Voltar">←</a>
            <div class="marca-topo">Extrato Completo</div>
            <button class="botao-tema" id="botao-tema" aria-label="Mudar tema">
                <svg class="icone-tema-escuro" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
                <svg class="icone-tema-claro" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </button>
        </header>

        <main class="conteudo-principal">

            <div class="campo-filtro" style="margin-bottom: 14px;">
                <label for="filtro-texto">Buscar por descrição ou categoria</label>
                <input type="text" id="filtro-texto" placeholder="Ex: Mercado, Uber, Alimentação...">
            </div>

            <div class="filtros-extrato">
                <div class="campo-filtro">
                    <label for="filtro-mes">Mês</label>
                    <div class="filtro-mes-wrapper">
                        <input type="month" id="filtro-mes">
                        <button type="button" id="limpar-filtro-mes" class="botao-limpar-filtro" title="Ver todos os meses">✕</button>
                    </div>
                </div>
                <div class="campo-filtro">
                    <label for="filtro-valor">Buscar por valor</label>
                    <input type="text" inputmode="decimal" id="filtro-valor" step="0.01" placeholder="Ex: 50">
                </div>
            </div>

            <ul class="lista-lancamentos" id="lista-extrato"></ul>
            <p class="lista-vazia" id="extrato-vazio" hidden>Nenhum lançamento encontrado com esse filtro.</p>
        </main>

        <nav class="nav-inferior" id="nav-inferior">
            <a href="dashboard.html" class="item-nav-inferior" aria-label="Início">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/></svg>
                <span>Início</span>
            </a>
            <a href="extrato.html" class="item-nav-inferior ativo" aria-label="Extrato">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 4h12v16l-3-2-3 2-3-2-3 2Z"/><path d="M9 9h6M9 13h6"/></svg>
                <span>Extrato</span>
            </a>
            <a href="guardado.html" class="item-nav-inferior" aria-label="Guardado">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12a7 7 0 0 1 7-7c3 0 4.5 1.3 5.5 2.5H19l1 2-2 1v2l-2 1.5v2h-2v-1.5H9.5L9 17H6v-2.5C4.7 13.5 4 12.9 4 12Z"/><circle cx="9" cy="12" r="0.8" fill="currentColor" stroke="none"/></svg>
                <span>Guardado</span>
            </a>
            <a href="dashboard.html?menu=1" class="item-nav-inferior" id="botao-mais-nav-inferior" aria-label="Mais opções">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg>
                <span>Mais</span>
            </a>
        </nav>
    </div>

    <!-- Toast — avisos rápidos no rodapé da tela -->
    <div class="toast" id="toast" hidden>
        <span id="toast-mensagem"></span>
        <button type="button" id="toast-botao-acao" hidden></button>
    </div>

    <div class="fundo-modal" id="fundo-modal-confirmar">
        <div class="modal-lancamento">
            <div class="cabecalho-modal">
                <h3 id="titulo-modal-confirmar">Confirmar</h3>
                <button class="botao-fechar-modal" id="botao-fechar-confirmar" aria-label="Fechar">✕</button>
            </div>
            <p class="texto-explicativo-guardado" id="texto-modal-confirmar"></p>
            <button type="button" class="botao-enviar" id="botao-confirmar-acao">Confirmar</button>
            <button type="button" class="link-botao-simples" id="botao-cancelar-acao" style="display:block; margin: 14px auto 0;">Cancelar</button>
        </div>
    </div>

    <script type="module" src="extrato.js"></script>
</body>
</html>
