<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Trocar E-mail/Senha — Bull</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="variaveis.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="extrato.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0A0A0A">
    <link rel="apple-touch-icon" href="icone-192.png">
    <link rel="icon" href="favicon-32.png" sizes="32x32">
    <link rel="icon" href="favicon-16.png" sizes="16x16">
</head>
<body>

    <div class="app-shell">
        <header class="topo-app">
            <a href="configuracoes.html" class="link-voltar" aria-label="Voltar">←</a>
            <div class="marca-topo">Trocar E-mail/Senha</div>
            <span style="width:24px"></span>
        </header>

        <main class="conteudo-principal">
            <p class="texto-explicativo-guardado">
                Por segurança, você precisa confirmar sua senha atual antes de trocar o e-mail ou a senha da conta.
            </p>

            <div class="campo">
                <label for="campo-senha-atual">Sua senha atual</label>
                <div class="campo-senha-wrapper">
                    <input type="password" id="campo-senha-atual" placeholder="Digite sua senha atual" autocomplete="current-password">
                    <button type="button" class="botao-olho" id="botao-olho-atual" aria-label="Mostrar senha">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>

            <hr style="border: 0; border-top: 1px solid var(--borda); margin: 24px 0;">

            <h3 class="titulo-secao">Trocar e-mail</h3>
            <div class="campo">
                <label for="campo-novo-email">Novo e-mail</label>
                <input type="email" id="campo-novo-email" placeholder="novo@email.com">
            </div>
            <div class="mensagem-aviso" id="mensagem-aviso-email"></div>
            <button type="button" class="botao-enviar" id="botao-salvar-email">
                <span class="texto-botao">Salvar novo e-mail</span>
                <span class="spinner-botao" hidden></span>
            </button>

            <hr style="border: 0; border-top: 1px solid var(--borda); margin: 28px 0;">

            <h3 class="titulo-secao">Trocar senha</h3>
            <div class="campo">
                <label for="campo-nova-senha">Nova senha</label>
                <div class="campo-senha-wrapper">
                    <input type="password" id="campo-nova-senha" placeholder="Mínimo 6 caracteres" minlength="6" autocomplete="new-password">
                    <button type="button" class="botao-olho" id="botao-olho-nova" aria-label="Mostrar senha">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="campo">
                <label for="campo-confirmar-nova-senha">Confirmar nova senha</label>
                <div class="campo-senha-wrapper">
                    <input type="password" id="campo-confirmar-nova-senha" placeholder="Repete a nova senha" minlength="6" autocomplete="new-password">
                    <button type="button" class="botao-olho" id="botao-olho-confirmar-nova" aria-label="Mostrar senha">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="mensagem-aviso" id="mensagem-aviso-senha"></div>
            <button type="button" class="botao-enviar" id="botao-salvar-senha">
                <span class="texto-botao">Salvar nova senha</span>
                <span class="spinner-botao" hidden></span>
            </button>
        </main>
    </div>

    <div class="toast" id="toast" hidden>
        <span id="toast-mensagem"></span>
        <button type="button" id="toast-botao-acao" hidden></button>
    </div>

    <script type="module" src="conta.js"></script>
</body>
</html>
